[functions.send-contact-email]
enabled = true
verify_jwt = false
import_map = "./functions/send-contact-email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-contact-email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-contact-email/*.html" ]

[functions.notify-profile-status]
enabled = true
# Called by a Database Webhook, authenticated with the x-webhook-secret header.
verify_jwt = false
import_map = "./functions/notify-profile-status/deno.json"
entrypoint = "./functions/notify-profile-status/index.ts"
